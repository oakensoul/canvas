name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # Required for PyPI trusted publishing (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime deps
        run: pip install -e .

      - name: Generate SBOM
        run: pip install cyclonedx-bom && cyclonedx-py environment --output-format json -o sbom.json

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: Build
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe4860a8c4cecad1a0e1a46aad5fe8b78cdba # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.json

      # TODO: Add PyPI publish via OIDC when ready
